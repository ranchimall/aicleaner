<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Text Cleaner</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    color: #eee;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .container {
    width: 90%;
    max-width: 800px;
    background: rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(12px);
    border-radius: 16px;
    padding: 25px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }

  h2 {
    text-align: center;
    margin-bottom: 20px;
    font-weight: 500;
  }

  textarea {
    width: 100%;
    height: 180px;
    margin-bottom: 20px;
    padding: 15px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(0,0,0,0.4);
    color: #fff;
    font-size: 14px;
    outline: none;
    transition: 0.3s;
    resize: vertical;
  }

  textarea:focus {
    border-color: #0a84ff;
    box-shadow: 0 0 10px rgba(10,132,255,0.5);
  }

  .btn-wrapper {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
  }

  button {
    padding: 14px 40px;
    font-size: 16px;
    border-radius: 999px;
    background: linear-gradient(135deg, #0a84ff, #5ac8fa);
    color: white;
    border: none;
    cursor: pointer;
    transition: 0.3s;
    font-weight: 500;
  }

  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(10,132,255,0.4);
  }

  button:active {
    transform: scale(0.97);
  }

</style>
</head>

<body>

<div class="container">

  <h2>AI Markup Cleaner</h2>

  <textarea id="input" placeholder="Paste your messy text here..."></textarea>

  <div class="btn-wrapper">
    <button onclick="cleanText()">Clean Text</button>
  </div>

  <textarea id="output" placeholder="Cleaned text will appear here..."></textarea>

</div>

<script>
function cleanText() {
  let text = document.getElementById("input").value;

  text = text.replace(/\r\n/g, "\n");
  text = text.replace(/^#{1,6}\s*/gm, "");
  text = text.replace(/(\*\*|__)(.*?)\1/g, "$2");
  text = text.replace(/(\*|_)(.*?)\1/g, "$2");
  text = text.replace(/`([^`]+)`/g, "$1");
  text = text.replace(/^[-*]{3,}$/gm, "");
  text = text.replace(/^[\t ]*[\*\-•]\s+/gm, "• ");
  text = text.replace(/^[\t ]*(\d+)\.\s+/gm, "$1. ");
  text = text.replace(/^\s*>\s?/gm, "");
  text = text.replace(/\n{3,}/g, "\n\n");

  document.getElementById("output").value = text.trim();
}
</script>

</body>
</html>
